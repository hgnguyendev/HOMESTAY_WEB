<div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">Xác thực OTP</h2>
            <p class="text-gray-600">Vui lòng nhập mã xác thực đã được gửi đến email/số điện thoại của bạn</p>
        </div>

        <!-- OTP Form -->
        <form [formGroup]="otpForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- OTP Inputs -->
            <div class="flex justify-center space-x-3">
                <input *ngFor="let control of [0,1,2,3,4,5]; let i = index" #otpInput 
                    [formControlName]="'otp' + i" type="text" maxlength="1"
                    class="w-12 h-12 text-center text-xl font-bold border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all duration-200 outline-none"
                    (input)="moveNext($event, i)" />
            </div>

            <!-- Timer -->
            <div class="text-center">
                <div class="inline-flex items-center px-4 py-2 bg-blue-50 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <p class="text-gray-700" *ngIf="!otpExpired">
                        Mã OTP hết hạn sau: <span class="font-bold text-blue-600">{{timeLeft}}</span> giây
                    </p>
                    <p class="text-red-500 font-medium" *ngIf="otpExpired">Mã OTP đã hết hạn</p>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" [disabled]="otpForm.invalid"
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-medium rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                Xác nhận
            </button>
        </form>

        <!-- Resend OTP -->
        <div class="mt-6 text-center">
            <p class="text-gray-600 mb-3">Không nhận được mã?</p>
            <button [disabled]="timeLeft > 0" 
                class="inline-flex items-center text-blue-600 hover:text-blue-800 font-medium transition-colors duration-200 disabled:opacity-50 disabled:cursor-not-allowed"
                (click)="handleRensendOtp()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Gửi lại mã OTP
            </button>
        </div>
    </div>
</div>
