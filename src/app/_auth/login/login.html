
<div class="flex items-center justify-center p-6 lg:p-12 bg-white">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl lg:text-3xl font-bold text-gray-800">Chào mừng trở lại</h1>
            <p class="text-gray-600 mt-2">Đăng nhập để tiếp tục trải nghiệm dịch vụ homestay</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
            <div>
                <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">
                    Email <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input type="email" id="loginEmail" formControlName="email"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition form-input placeholder-gray-400 placeholder-opacity-50"
                        placeholder="your.email@example.com" [class.border-red-500]="email?.invalid && email?.touched">
                    <i class="fas fa-envelope absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                </div>
                <div *ngIf="email?.invalid && email?.touched" class="text-red-500 text-xs mt-1">
                    <span *ngIf="email?.errors?.['required']">Vui lòng nhập email</span>
                    <span *ngIf="email?.errors?.['email']">Email không hợp lệ</span>
                </div>
            </div>

            <!-- Mật khẩu -->
            <div>
                <div class="flex items-center justify-between mb-1">
                    <label for="loginPassword" class="block text-sm font-medium text-gray-700">
                        Mật khẩu <span class="text-red-500">*</span>
                    </label>
                    <button type="button" (click)="forgotPassword()"
                        class="text-sm text-green-600 hover:text-green-700 font-medium cursor-pointer">
                        Quên mật khẩu?
                    </button>
                </div>
                <div class="relative">
                    <input [type]="hidePassword ? 'password' : 'text'" id="loginPassword" formControlName="password"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:border-transparent transition form-input placeholder-gray-400 placeholder-opacity-50"
                        placeholder="Nhập mật khẩu của bạn"
                        [class.border-red-500]="password?.invalid && password?.touched">
                    <i class="fas fa-lock absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <button type="button"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                        (click)="togglePasswordVisibility()">
                        <i [class]="hidePassword ? 'fas fa-eye' : 'fas fa-eye-slash'"></i>
                    </button>
                </div>
                <div *ngIf="password?.invalid && password?.touched" class="text-red-500 text-xs mt-1">
                    Vui lòng nhập mật khẩu
                </div>
            </div>

            <button class="bg-gradient-to-r from-pink-500 via-orange-400 to-yellow-300 w-full text-white! py-3 px-4 rounded-lg hover:bg-green-700 transition duration-300 font-medium focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 cursor-pointer"
            (click)="handleLogin()"
            > 
                Đăng nhập
            </button>

            <div class="text-center pt-4">
                <p class="text-gray-600">
                    Chưa có tài khoản?
                    <button (click)="handleRegister()" class="text-green-600 hover:text-green-700 font-medium ml-1 cursor-pointer">
                        Đăng ký ngay
                    </button>
                </p>
            </div>
        </form>
    </div>
</div>
