<div class="h-screen flex flex-col justify-between items-center p-2">
    <div class="flex w-full justify-between items-center">
        <button><i class="bi bi-arrow-left-circle text-2xl cursor-pointer" (click)="handleNavigatoLogin()"></i></button>
    </div>
    <div class="">
        <div class="p-8 animate-slide-up">
            <div class="flex flex-col items-center mb-8">
                <div class="p-4 border-2 border-dashed border-gray-200 rounded-full mb-4">
                    <i
                        class="bi bi-fingerprint text-4xl bg-gradient-to-r from-purple-600 to-indigo-700 bg-clip-text text-transparent"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Forgot password?</h2>
                <p class="text-gray-600 text-center">No worries, we'll send you reset instructions.</p>
            </div>

            <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <input type="email" formControlName="email" placeholder="Enter your email"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all duration-200"
                            required />
                        <div class="absolute inset-y-0 right-0 flex items-center pr-3">
                            <i class="bi bi-eye text-gray-400"></i>
                        </div>
                    </div>
                    <div class="text-red-500" *ngIf="form.get('email')?.invalid && (form.get('email')?.touched)">
                        <small *ngIf="form.get('email')?.errors?.['required']">Email là bắt buộc.</small>
                        <small *ngIf="form.get('email')?.errors?.['email']">Email không hợp lệ.</small>
                    </div>
                </div>

                <button type="submit"
                    class="bg-gradient-to-r from-pink-500 via-orange-400 to-yellow-300 w-full text-white! py-3 px-4 rounded-lg hover:from-pink-600 hover:via-orange-500 hover:to-yellow-400 transition-all duration-300 font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 cursor-pointer flex items-center justify-center transform hover:-translate-y-0.5 shadow-md hover:shadow-lg">
                    <span>Reset Password</span>
                    <i class="bi bi-arrow-right ml-2"></i>
                </button>
            </form>
        </div>
    </div>
    <div>
    </div>
</div>
