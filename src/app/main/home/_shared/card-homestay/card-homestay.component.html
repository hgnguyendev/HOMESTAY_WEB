<!-- Card Homestay -->
<div class="rounded-2xl shadow-lg overflow-hidden bg-white card-hover max-w-sm w-full">
    <!-- Hình ảnh -->
    <div class="relative w-full h-64 overflow-hidden">
        <div class="w-full h-full bg-cover bg-center" [style.backgroundImage]="'url(' + ItemHomestay.images[0] + ')'">
        </div>

        <!-- Overlay gradient -->
        <div class="absolute inset-0 gradient-overlay"></div>

        <!-- Badge trạng thái -->
        <div class="absolute top-4 right-4 z-10">
            <span
                class="bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-full px-3 py-1.5 text-xs font-semibold shadow-lg">
                Phòng trống
            </span>
        </div>

        <!-- Đánh giá -->
        <div class="absolute bottom-4 left-4 z-10">
            <div class="bg-white/90 backdrop-blur-sm rounded-xl px-3 py-2 shadow-md">
                <div class="flex items-center">
                    <div class="flex text-amber-500">
                        <i class="bi bi-star-fill text-sm mr-1"></i>
                        <span class="font-bold text-gray-800">4.8</span>
                    </div>
                    <span class="text-gray-500 text-xs ml-1">(124 đánh giá)</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Nội dung -->
    <div class="p-3">
        <!-- Tên phòng và giá -->
        <div class="flex justify-between items-start mb-3">
            <h3 class="font-bold text-xl text-gray-900 truncate max-w-[200px]">
                {{ItemHomestay.roomName}}
            </h3>
            <div class="text-right">
                <p class="text-lg font-bold text-gray-900">{{ItemHomestay.price |
                    currency:'VND':'symbol':'1.0-0':'vi-VN'}}</p>
                <p class="text-xs text-gray-500">/ đêm</p>
            </div>
        </div>

        <!-- Địa chỉ -->
        <div class="flex items-center text-gray-600 mb-4">
            <i class="bi bi-geo-alt mr-2 text-gray-400"></i>
            <span class="text-sm">{{ItemHomestay.address}}</span>
        </div>

        <!-- Thông tin phòng -->
        <div class="flex items-center text-gray-700 mb-4">
            <div class="flex items-center mr-4">
                <i class="bi bi-people mr-1 text-gray-400"></i>
                <span class="text-sm">4 khách</span>
            </div>
            <div class="flex items-center">
                <i class="bi bi-door-closed mr-1 text-gray-400"></i>
                <span class="text-sm">2 phòng ngủ</span>
            </div>
        </div>

        <!-- Tiện nghi -->
        <div class="flex flex-wrap gap-2 mb-5">
            <span class="amenity-tag bg-blue-50 text-blue-700 rounded-full px-3 py-1.5 text-xs font-medium">
                <i class="bi bi-wifi mr-1"></i>Wifi
            </span>
            <span class="amenity-tag bg-green-50 text-green-700 rounded-full px-3 py-1.5 text-xs font-medium">
                <i class="bi bi-car-front-fill mr-1"></i>Bãi đỗ xe
            </span>
            <span class="amenity-tag bg-purple-50 text-purple-700 rounded-full px-3 py-1.5 text-xs font-medium">
                <i class="bi bi-tv mr-1"></i>TV
            </span>
            <span class="amenity-tag bg-amber-50 text-amber-700 rounded-full px-3 py-1.5 text-xs font-medium">
                <i class="bi bi-air-conditioner mr-1"></i>Điều hòa
            </span>
        </div>

        <!-- Nút hành động -->
        <button
            class="w-full bg-black hover:from-gray-800 hover:to-gray-600 text-white font-semibold py-2 rounded-lg transition-all duration-300 flex items-center justify-center shadow-md hover:shadow-lg cursor-pointer"
            (click)="handleDetails(ItemHomestay)">
            <i class="bi bi-eye mr-2"></i>
            XEM CHI TIẾT
        </button>
    </div>
</div>
