<div class="rounded-xl shadow-md overflow-hidden bg-white hover:shadow-lg transition-all">
    <!-- Hình ảnh -->
    <div class="relative w-full h-56 bg-cover bg-center"
        [style.backgroundImage]="'url(' + ItemHomestay.images[0] + ')'">
        <!-- Overlay -->
        <div class="absolute inset-0 bg-black/30"></div>
    </div>


    <!-- Nội dung -->
    <div class="p-4 space-y-2">
        <div class="flex justify-between items-center">
            <p class="font-semibold text-lg text-gray-800 max-w-[250px] truncate">
                {{ItemHomestay.roomName}}
            </p>
            <p class="flex items-center text-yellow-500">
                <i class="bi bi-star-fill mr-1"></i> {{ ItemHomestay.preview }}

            </p>
        </div>

        <p class="text-gray-600 flex items-center">
            <i class="bi bi-geo-alt mr-1"></i> {{ItemHomestay.address}}
        </p>

        <div class="text-gray-700">
            <p class="flex items-center"><i class="bi bi-people mr-1"></i> 4 khách</p>
            <div class="flex gap-3 text-sm text-black">
                <p class="bg-[#ccc] rounded-full px-3 py-1">Wifi</p>
                <p class="bg-[#ccc] rounded-full px-3 py-1">Chỗ đỗ xe</p>
                <p class="bg-[#ccc] rounded-full px-3 py-1">TV</p>
            </div>
        </div>

        <p class="text-lg font-bold text-gray-900">{{ItemHomestay.price}} / đêm</p>
    </div>


    <div class="w-full px-3 py-3">
        <button class="bg-black px-2 py-2 rounded-lg text-white! w-full cursor-pointer">XEM CHI TIẾT</button>
    </div>
</div>
