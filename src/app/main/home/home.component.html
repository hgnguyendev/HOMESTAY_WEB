<div *ngIf="!isSearchPage">
    <div class="h-[700px] w-full relative overflow-hidden">
        <!-- Background Images với overlay -->
        <div *ngFor="let img of bannerImages; let i = index" [ngClass]="{ 'active': i === currentIndex }"
            class="banner-slide absolute top-0 left-0 w-full h-full bg-cover bg-center transition-opacity duration-1000 ease-in-out"
            [style.backgroundImage]="'url(' + img.image + ')'">
        </div>

        <!-- Dark Overlay for better readability -->
        <div class="absolute inset-0 bg-black/40"></div>

        <!-- Content Container -->
        <div class="relative z-10 h-full flex items-center justify-center px-4 sm:px-6 lg:px-8">
            <div class="text-center text-white w-full max-w-6xl">
                <!-- Main Heading -->
                <div class="mb-12 animate-fade-in">
                    <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold mb-6 leading-tight">
                        Khám phá
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">
                            Homestay
                        </span>
                        <br>tuyệt vời nhất Việt Nam
                    </h1>
                    <p class="text-xl sm:text-2xl md:text-3xl opacity-95 font-light max-w-3xl mx-auto leading-relaxed">
                        Trải nghiệm lưu trú đích thực với những homestay được tuyển chọn kỹ lưỡng
                    </p>
                </div>

                <div class="animate-slide-up">
                    <div
                        class="bg-white/15 backdrop-blur-[4px] border border-white/20 rounded-3xl p-8 shadow-2xl relative overflow-hidden">
                        <div class="absolute inset-0 bg-gradient-to-br from-white/10 to-white/5"></div>
                        <div
                            class="absolute inset-0 rounded-3xl border border-white/30 shadow-[0_0_50px_rgba(255,255,255,0.1)]">
                        </div>

                        <div class="relative z-10">
                            <div class="text-center mb-8">
                                <h2 class="text-2xl sm:text-3xl font-bold text-white! mb-3">
                                    Bắt đầu cuộc phiêu lưu của bạn
                                </h2>
                                <p class="text-white/80 text-lg">
                                    Tìm homestay phù hợp với phong cách du lịch của bạn
                                </p>
                            </div>

                            <!-- Search Form -->
                            <form (ngSubmit)="onSubmit()" class="space-y-6">
                                <div class="grid grid-cols-1 lg:grid-cols-5 gap-4">
                                    <div class="lg:col-span-2 space-y-3">
                                        <label class="block text-sm font-semibold text-white/90">
                                            <i class="bi bi-geo-alt mr-2 text-yellow-400"></i>
                                            Địa điểm
                                        </label>
                                        <div class="relative">
                                            <i
                                                class="bi bi-geo-alt absolute left-4 top-1/2 transform -translate-y-1/2 text-yellow-400 text-lg"></i>
                                            <input type="text" [(ngModel)]="searchData.address" name="address"
                                                placeholder="Thành phố, địa điểm"
                                                class="w-full pl-12 pr-4 py-4 bg-white/20 border border-white/30 rounded-xl text-white placeholder-white/60 focus:bg-white/30 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400/50 transition-all duration-300 backdrop-blur-sm">
                                        </div>
                                    </div>

                                    <div class="space-y-3">
                                        <label class="block text-sm font-semibold text-white/90">
                                            <i class="bi bi-calendar-check mr-2 text-yellow-400"></i>
                                            Nhận phòng
                                        </label>
                                        <div class="relative">
                                            <i
                                                class="bi bi-calendar-check absolute left-4 top-1/2 transform -translate-y-1/2 text-yellow-400 text-lg"></i>
                                            <input type="date" [(ngModel)]="searchData.startDate" name="checkIn"
                                                class="w-full pl-12 pr-4 py-4 bg-white/20 border border-white/30 rounded-xl text-white focus:bg-white/30 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400/50 transition-all duration-300 backdrop-blur-sm date-input">
                                        </div>
                                    </div>

                                    <div class="space-y-3">
                                        <label class="block text-sm font-semibold text-white/90">
                                            <i class="bi bi-calendar-x mr-2 text-yellow-400"></i>
                                            Trả phòng
                                        </label>
                                        <div class="relative">
                                            <i
                                                class="bi bi-calendar-x absolute left-4 top-1/2 transform -translate-y-1/2 text-yellow-400 text-lg"></i>
                                            <input type="date" [(ngModel)]="searchData.endDate" name="checkOut"
                                                class="w-full pl-12 pr-4 py-4 bg-white/20 border border-white/30 rounded-xl text-white focus:bg-white/30 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400/50 transition-all duration-300 backdrop-blur-sm date-input">
                                        </div>
                                    </div>

                                    <div class="space-y-3">
                                        <label class="block text-sm font-semibold text-white/90">
                                            <i class="bi bi-currency-dollar mr-2 text-yellow-400"></i>
                                            Giá Phòng
                                        </label>
                                        <div class="relative">
                                            <i
                                                class="bi bi-currency-dollar absolute left-4 top-1/2 transform -translate-y-1/2 text-yellow-400 text-lg"></i>
                                            <input type="text" [(ngModel)]="searchData.price" name="price"
                                                placeholder="Giá phòng"
                                                class="w-full pl-12 pr-4 py-4 bg-white/20 border border-white/30 rounded-xl text-white placeholder-white/60 focus:bg-white/30 focus:border-yellow-400 focus:ring-2 focus:ring-yellow-400/50 transition-all duration-300 backdrop-blur-sm">
                                        </div>
                                    </div>

                                    <!-- <div class="space-y-3">
                                        <label class="block text-sm font-semibold text-white/90">
                                            <i class="bi bi-people mr-2 text-yellow-400"></i>
                                            Số khách
                                        </label>
                                        <div class="flex items-center justify-between gap-3">
                                            <div
                                                class="flex items-center justify-between bg-white/20 border border-white/30 rounded-xl overflow-hidden flex-1 backdrop-blur-sm">
                                                <button type="button" (click)="decreaseGuests()"
                                                    class="px-4 py-4 text-white hover:bg-white/20 transition-colors duration-200">
                                                    <i class="bi bi-dash-lg"></i>
                                                </button>
                                                <input type="number" [(ngModel)]="searchData.guests" name="guests"
                                                    min="1" max="10"
                                                    class="w-12 text-center py-4 bg-transparent border-none text-white focus:ring-0">
                                                <button type="button" (click)="increaseGuests()"
                                                    class="px-4 py-4 text-white hover:bg-white/20 transition-colors duration-200">
                                                    <i class="bi bi-plus-lg"></i>
                                                </button>
                                            </div>

                                        </div>
                                    </div> -->
                                </div>
                                <div class="w-full">
                                    <button type="submit"
                                        class="bg-gradient-to-r from-yellow-500 to-orange-500 hover:from-yellow-600 hover:to-orange-600 text-white py-2 px-6 rounded-xl font-semibold text-lg transform hover:scale-105 transition-all duration-300 shadow-lg hover:shadow-xl w-full flex items-center justify-center gap-2 cursor-pointer">
                                        <i class="bi bi-search text-xl"></i>
                                        <span class="hidden sm:inline">Tìm kiếm Homestay</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div>
        <homestay-outstanding></homestay-outstanding>
    </div>

    <div>
        <service-introduction></service-introduction>
    </div>
</div>

<div><router-outlet></router-outlet></div>
