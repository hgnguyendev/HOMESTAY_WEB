<div class="max-w-6xl mx-auto py-6 relative border-b border-gray-300">
    <div class="flex items-center justify-start gap-6 relative border-b border-gray-300 py-2">
        <div *ngFor="let item of menuStatusHomestay" class="relative">
            <button class="text-lg cursor-pointer pb-2 transition-all duration-200"
                (click)="handleChangeStatusHomestay(item.type)" [ngClass]="{
          'text-black font-semibold': item.type === isActive,
          'text-gray-500': item.type !== isActive
        }">
                {{item.name}}
            </button>

            <span *ngIf="item.type === isActive"
                class="absolute left-0 bottom-[-8px] w-full h-1 bg-black -mb-0.5 rounded"></span>
        </div>
    </div>

    <div *ngIf="listHomestayBooked.length > 0">
        <div *ngFor="let item of listHomestayBooked" class="my-4">
            <div
                class="relative flex border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-shadow duration-200 p-4 gap-4 items-center bg-white">
                <div class="relative w-28 h-20 flex-shrink-0 rounded-lg overflow-hidden">
                    <img [src]="item.images[0]" alt="{{item.roomName}}" class="w-full h-full object-cover" />
                    <div *ngIf="item.status === 'paid'"
                        class="absolute top-1 right-1 flex items-center bg-white/90 text-green-600 text-[9px] font-medium px-1 py-0.5 rounded-full shadow-sm">
                        <i class="bi bi-check-circle-fill text-green-600"></i>
                        <span class="ml-0.5">Đã thanh toán</span>
                    </div>
                    <div *ngIf="item.status === 'cancel'"
                        class="absolute top-1 right-1 flex items-center bg-white/90 text-red-600 text-[9px] font-medium px-1 py-0.5 rounded-full shadow-sm">
                        <i class="bi bi-x-circle-fill text-red-600"></i>
                        <span class="ml-0.5">Chưa thanh toán</span>
                    </div>
                </div>

                <div class="flex-1 flex flex-col justify-between gap-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800" style="margin-bottom: 0;">{{item.roomName}}
                            </h3>
                            <div class="flex items-center text-gray-500 gap-1 text-sm mt-1">
                                <i class="bi bi-geo-alt-fill"></i>
                                <p class="truncate m-0" style="margin-bottom: 0;">{{item.address}}</p>
                            </div>
                        </div>
                        <div class="text-purple-600 font-bold text-lg">
                            {{item.amount | currency:'VND':'symbol':'1.0-0'}}
                        </div>
                    </div>

                    <div class="flex justify-between items-center text-gray-500 text-sm mt-2 gap-4">
                        <div class="flex items-center gap-2">
                            <i class="bi bi-calendar-event-fill"></i>
                            <p class="m-0" style="margin-bottom: 0;">{{item.check_in_date | date:'dd/MM/yyyy'}}</p>
                            <i class="bi bi-arrow-right-short"></i>
                            <p class="m-0" style="margin-bottom: 0;">{{item.check_out_date | date:'dd/MM/yyyy'}}</p>
                        </div>
                        <button
                            class="ml-auto text-purple-600 font-medium hover:text-purple-800 flex items-center gap-1 transition-colors cursor-pointer"
                            (click)="handlleDetailsInvoice(item)">
                            Xem chi tiết <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <button class="absolute right-[-4px] top-[-12px] cursor-pointer" (click)="handleDeleteHomestayBooked(item._id)"><i
                        class="bi bi-x-circle-fill text-red-400! hover:text-red-600! transition-all duration-300 text-xl"></i></button>
            </div>
        </div>


    </div>

    <div *ngIf="listHomestayBooked.length <= 0" class="mt-10">
        <h1 class="text-2xl font-bold text-center mb-0 text-[#ccc]!">Hiện tại bạn chưa đặt homestay nào</h1>
    </div>
</div>
