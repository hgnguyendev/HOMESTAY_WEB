<div class="">
    <div class="">
        <!-- Header -->
        <div class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">Thông tin cá nhân</h1>
            <p class="mt-2 text-gray-600">Quản lý thông tin cá nhân của bạn</p>
        </div>

        <!-- User Profile Card -->
        <div class="bg-white shadow-xl rounded-2xl overflow-hidden">
            <!-- Avatar Section -->
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 p-6 text-center">
                <div class="relative inline-block">
                    <img [src]="user.avatar" alt="Avatar"
                        class="w-32 h-32 rounded-full border-4 border-white shadow-lg mx-auto">
                    <button *ngIf="!isEditing"
                        class="absolute bottom-2 right-2 bg-white p-2 rounded-full shadow-md hover:bg-gray-100 transition-colors">
                        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                        </svg>
                    </button>
                </div>
                <h2 class="mt-4 text-2xl font-bold text-white">{{ user.name }}</h2>
            </div>

            <!-- Information Section -->
            <div class="p-6 space-y-6">
                <!-- Name -->
                <div class="flex items-start space-x-4">
                    <div class="flex-shrink-0">
                        <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-500">Họ và tên</label>
                        <div *ngIf="!isEditing" class="mt-1 text-lg font-semibold text-gray-900">
                            {{ user.name }}
                        </div>
                        <input *ngIf="isEditing" [(ngModel)]="editedUser.name" type="text"
                            class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Email -->
                <div class="flex items-start space-x-4">
                    <div class="flex-shrink-0">
                        <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                            </svg>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-500">Email</label>
                        <div *ngIf="!isEditing" class="mt-1 text-lg font-semibold text-gray-900">
                            {{ user.email }}
                        </div>
                    </div>
                </div>

                <!-- Phone -->
                <div class="flex items-start space-x-4">
                    <div class="flex-shrink-0">
                        <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                            </svg>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-500">Số điện thoại</label>
                        <div *ngIf="!isEditing" class="mt-1 text-lg font-semibold text-gray-900">
                            {{ user.phone }}
                        </div>
                        <input *ngIf="isEditing" [(ngModel)]="editedUser.phone" type="tel"
                            class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>
                </div>

                <!-- Address -->
                <div class="flex items-start space-x-4">
                    <div class="flex-shrink-0">
                        <div class="w-10 h-10 bg-orange-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                        </div>
                    </div>
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-gray-500">Địa chỉ</label>
                        <div *ngIf="!isEditing" class="mt-1 text-lg font-semibold text-gray-900">
                            {{ user.address }}
                        </div>
                        <textarea *ngIf="isEditing" [(ngModel)]="editedUser.address" rows="3"
                            class="mt-1 block w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="bg-gray-50 px-6 py-4 flex justify-end space-x-3">
                <button *ngIf="!isEditing" (click)="toggleEdit()"
                    class="px-6 py-2 bg-blue-600 text-white! rounded-lg hover:bg-blue-700 transition-all duration-300 cursor-pointer">
                    Chỉnh sửa
                </button>

                <div *ngIf="isEditing" class="flex gap-2">
                    <button (click)="cancelEdit()"
                        class="px-6 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-100 transition-all duration-300 cursor-pointer">
                        Hủy
                    </button>

                    <button (click)="saveChanges()" [disabled]="isSaving"
                        class="px-6 py-2 bg-blue-600 ml-1 text-white! rounded-lg hover:bg-blue-700 disabled:opacity-60 transition-all duration-300 cursor-pointer">
                        <ng-container *ngIf="!isSaving">Lưu thay đổi</ng-container>
                        <ng-container *ngIf="isSaving">
                            <i class="bi bi-arrow-repeat animate-spin mr-2"></i> Đang lưu...
                        </ng-container>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
