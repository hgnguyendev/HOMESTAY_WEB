<!-- Main Header -->
<div class="sticky top-0 z-50 bg-white shadow-lg">
    <div class="px-6 py-2 flex items-center justify-between">
        <!-- Logo Section -->
        <div class="flex items-center gap-3 cursor-pointer">
            <div
                class="bg-gradient-to-r from-pink-500 via-orange-400 to-yellow-300 rounded-2xl text-white p-3 shadow-md transform hover:scale-105 transition-transform duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor"
                    class="bi bi-house-door" viewBox="0 0 16 16">
                    <path
                        d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z" />
                </svg>
            </div>
            <div>
                <h6 class="text-xl font-bold text-gray-800 mb-0" style="margin-bottom: 0;">StayHome</h6>
                <p class="text-sm text-gray-600 " style="margin-bottom: 0;">Homestay Việt Nam</p>
            </div>
        </div>

        <div class="hidden lg:flex items-center gap-8">
            <div *ngFor="let menu of navigator" [ngClass]="{'text-orange-500 border-b-2' : isActiveRoute(menu.url)}"
                (click)="handleNavigator(menu.url)" class="group">
                <div class="cursor-pointer transition-all duration-300" [class]="menu.isActive ? 
            'text-orange-500 border-b-2 border-orange-500' : 
            'text-gray-700 hover:text-orange-500 border-b-2 border-transparent hover:border-orange-400'">
                    <p class="font-medium py-2 px-1 transition-colors duration-300" style="margin-bottom: 0;">
                        {{menu.name}}
                    </p>
                </div>
            </div>
        </div>

        <div class="">
            <button
                class="py-1 px-2 rounded-xl bg-gradient-to-r from-gray-50 to-gray-100 hover:from-gray-100 hover:to-gray-200 transition-all duration-300 shadow-sm hover:shadow-md cursor-pointer"
                nz-dropdown nzTrigger="click" [nzDropdownMenu]="menu">
                <i class="bi bi-list text-lg"></i>
            </button>
            <nz-dropdown-menu #menu="nzDropdownMenu">
                <ul nz-menu class="py-1">
                    <li nz-menu-item class="hover:bg-gray-100 px-3 py-1" (click)="handleInfo()">
                        <div class="flex justify-between items-center w-40">
                            <span class="text-gray-700">Thông tin cá nhân</span>
                            <i class="bi bi-person-lines-fill text-blue-500"></i>
                        </div>
                    </li>
                    <li nz-menu-item (click)="handleLogout()" class="hover:bg-gray-100 px-3 py-1">
                        <div class="flex justify-between items-center w-40">
                            <span class="text-red-500">Đăng xuất</span>
                            <i class="bi bi-box-arrow-left text-red-500"></i>
                        </div>
                    </li>
                </ul>
            </nz-dropdown-menu>
        </div>
    </div>
</div>
